syntax = "proto3";

package medusa.workload.v1;

option java_multiple_files = true;

option java_package = "software.medusa.workload.v1";

// The admin plane: managing workers, profiles, and (worker, profile) grants. Consumed by the
// console (SPA), behind the same auth as WorkloadService — not reachable with worker credentials.
service FleetService {
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);
  rpc ApproveWorker(ApproveWorkerRequest) returns (ApproveWorkerResponse);
  rpc RejectWorker(RejectWorkerRequest) returns (RejectWorkerResponse);
  rpc RevokeWorker(RevokeWorkerRequest) returns (RevokeWorkerResponse);

  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  // Appends a revision; never mutates an existing one.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc ArchiveProfile(ArchiveProfileRequest) returns (ArchiveProfileResponse);
  rpc ListProfileRevisions(ListProfileRevisionsRequest) returns (ListProfileRevisionsResponse);
  // Dry-run mint against the latest revision's target service account; never returns a usable
  // token. CreateProfile/UpdateProfile run this implicitly against the revision they create.
  rpc VerifyProfile(VerifyProfileRequest) returns (VerifyProfileResponse);

  // Read-only preview: resolve a docker_image tag to a digest as a given target service account,
  // without creating anything. The console calls this so an admin sees the exact digest a tag
  // resolves to *before* pinning it, and so a missing artifactregistry.reader grant surfaces in the
  // form rather than as a flag on an already-created revision. The digest it returns is then passed
  // back as CreateProfile/UpdateProfile's expected_docker_image_digest (see there).
  rpc ResolveImage(ResolveImageRequest) returns (ResolveImageResponse);

  rpc GrantProfile(GrantProfileRequest) returns (GrantProfileResponse);
  rpc RevokeProfileGrant(RevokeProfileGrantRequest) returns (RevokeProfileGrantResponse);

  // Enrollment tokens (M4 Path A): an admin mints a one-time `wle_` token and hands it to a
  // teammate, who exchanges it for a worker credential at registration. The plaintext is returned
  // by CreateEnrollmentToken exactly once and never again — only its hash is stored.
  rpc CreateEnrollmentToken(CreateEnrollmentTokenRequest) returns (CreateEnrollmentTokenResponse);
  rpc ListEnrollmentTokens(ListEnrollmentTokensRequest) returns (ListEnrollmentTokensResponse);
  rpc RevokeEnrollmentToken(RevokeEnrollmentTokenRequest) returns (RevokeEnrollmentTokenResponse);
}

enum WorkerStatus {
  WORKER_STATUS_UNSPECIFIED = 0;
  WORKER_STATUS_PENDING = 1;
  WORKER_STATUS_ACTIVE = 2;
  WORKER_STATUS_REJECTED = 3;
  WORKER_STATUS_REVOKED = 4;
}

// Whether the target SA's owning project has granted the broker impersonation rights, and (if
// the revision references any) whether that SA can read the referenced secrets.
enum VerificationStatus {
  VERIFICATION_STATUS_UNSPECIFIED = 0;
  VERIFICATION_STATUS_UNVERIFIED = 1;
  VERIFICATION_STATUS_VERIFIED = 2;
  VERIFICATION_STATUS_BINDING_MISSING = 3;
  VERIFICATION_STATUS_SECRET_INACCESSIBLE = 4;
}

// Outcome of resolving a revision's docker_image tag to an immutable digest at creation time
// (via an Artifact Registry manifest request impersonating the target SA).
enum ImageStatus {
  IMAGE_STATUS_UNSPECIFIED = 0;
  // The revision has no image (a pure exec/env profile).
  IMAGE_STATUS_NOT_APPLICABLE = 1;
  // A digest was pinned; the revision is image-claimable.
  IMAGE_STATUS_RESOLVED = 2;
  // Permanent denial (missing artifactregistry.reader binding, a typo, or a missing tag/repo).
  IMAGE_STATUS_UNRESOLVABLE = 3;
  // Transient failure; retried on the next create/update/verify.
  IMAGE_STATUS_UNDETERMINED = 4;
}

message Worker {
  string worker_id = 1;
  string name = 2;
  string hostname = 3;
  string os = 4;
  string cli_version = 5;
  WorkerStatus status = 6;
  // Only set while status is PENDING.
  string confirmation_code = 7;
  string created_at = 8;
  string approved_at = 9;
  string approved_by = 10;
  // Empty until M2 adds worker heartbeats.
  string last_seen_at = 11;
  repeated string granted_profile_ids = 12;
  // Which registration plane the worker came through: "v1" (open registration + confirmation code)
  // or "v2" (enrollment-token exchange). The console shows this; it's the M4-A5 v1-retirement gate.
  string registered_via = 13;
  // The source IP the worker registered from — recorded for v2 (shown on a require_approval pending
  // row as a defense-in-depth signal); empty for v1.
  string source_ip = 14;
}

message ListWorkersRequest {}

message ListWorkersResponse {
  repeated Worker workers = 1;
}

message ApproveWorkerRequest {
  string worker_id = 1;
}

message ApproveWorkerResponse {
  Worker worker = 1;
}

message RejectWorkerRequest {
  string worker_id = 1;
}

message RejectWorkerResponse {
  Worker worker = 1;
}

message RevokeWorkerRequest {
  string worker_id = 1;
}

message RevokeWorkerResponse {
  Worker worker = 1;
}

message Profile {
  string profile_id = 1;
  string display_name = 2;
  int32 latest_revision = 3;
  bool archived = 4;
  string created_at = 5;
}

message ProfileRevision {
  string profile_id = 1;
  int32 revision = 2;
  string target_service_account = 3;
  string created_at = 4;
  string created_by = 5;
  string note = 6;
  VerificationStatus verification_status = 7;
  // Plain, non-secret env vars: name -> value.
  map<string, string> env_vars = 8;
  // Secret-backed env vars: name -> Secret Manager resource name
  // (projects/.../secrets/.../versions/latest or a pinned version).
  map<string, string> secret_env_vars = 9;
  // Optional container image tag ref (e.g. LOCATION-docker.pkg.dev/PROJECT/REPO/IMAGE:TAG). Empty
  // for a pure exec/env profile.
  string docker_image = 10;
  // The digest docker_image resolved to at revision creation (sha256:...). Empty until/unless
  // resolution succeeds; a moved tag yields a different digest between revisions.
  string docker_image_digest = 11;
  // Resolution verdict for docker_image.
  ImageStatus image_status = 12;
}

message ListProfilesRequest {}

message ListProfilesResponse {
  repeated Profile profiles = 1;
}

message CreateProfileRequest {
  string profile_id = 1;
  string display_name = 2;
  string target_service_account = 3;
  string note = 4;
  map<string, string> env_vars = 5;
  map<string, string> secret_env_vars = 6;
  // Optional container image tag ref; the digest is resolved server-side.
  string docker_image = 7;
  // Optional compare-and-swap token: the digest a prior ResolveImage returned for this
  // docker_image. If set, the backend re-resolves the tag and rejects the create (FAILED_PRECONDITION)
  // when it no longer resolves to this digest — so the admin can only ever pin the exact digest they
  // previewed. Empty means "resolve fresh, no check" (e.g. non-console clients).
  string expected_docker_image_digest = 8;
}

message CreateProfileResponse {
  Profile profile = 1;
  ProfileRevision revision = 2;
}

message UpdateProfileRequest {
  string profile_id = 1;
  string target_service_account = 2;
  string note = 3;
  map<string, string> env_vars = 4;
  map<string, string> secret_env_vars = 5;
  // Optional container image tag ref; the digest is resolved server-side.
  string docker_image = 6;
  // Compare-and-swap token; see CreateProfileRequest.expected_docker_image_digest.
  string expected_docker_image_digest = 7;
}

message ResolveImageRequest {
  string target_service_account = 1;
  string docker_image = 2;
}

message ResolveImageResponse {
  // The digest the tag resolved to (sha256:...), or empty when it couldn't be resolved.
  string docker_image_digest = 1;
  ImageStatus image_status = 2;
  // Safe-to-show diagnostic when the status isn't RESOLVED (e.g. why it's unresolvable).
  string detail = 3;
}

message UpdateProfileResponse {
  Profile profile = 1;
  ProfileRevision revision = 2;
}

message ArchiveProfileRequest {
  string profile_id = 1;
}

message ArchiveProfileResponse {
  Profile profile = 1;
}

message ListProfileRevisionsRequest {
  string profile_id = 1;
}

message ListProfileRevisionsResponse {
  repeated ProfileRevision revisions = 1;
}

message VerifyProfileRequest {
  string profile_id = 1;
}

message VerifyProfileResponse {
  ProfileRevision revision = 1;
}

// An outstanding enrollment token as shown in the console. Never carries the plaintext token or its
// hash — only the metadata needed to list, identify, and revoke it.
message EnrollmentToken {
  string enrollment_token_id = 1;
  string note = 2;
  string created_by = 3;
  string created_at = 4;
  string expires_at = 5;
  bool require_approval = 6;
}

message CreateEnrollmentTokenRequest {
  // Optional free-text label, e.g. "for Kuba's MBP".
  string note = 1;
  // Days until the token expires; the server applies a default (7) when unset or non-positive.
  int32 expires_in_days = 2;
  // When set, a worker registering with this token lands PENDING for admin approval instead of
  // going straight to ACTIVE.
  bool require_approval = 3;
}

message CreateEnrollmentTokenResponse {
  // The plaintext `wle_` token — shown once, never retrievable again.
  string token = 1;
  EnrollmentToken enrollment_token = 2;
}

message ListEnrollmentTokensRequest {}

message ListEnrollmentTokensResponse {
  // Outstanding tokens only (never redeemed, never revoked, not expired), newest first.
  repeated EnrollmentToken enrollment_tokens = 1;
}

message RevokeEnrollmentTokenRequest {
  string enrollment_token_id = 1;
}

message RevokeEnrollmentTokenResponse {}

message GrantProfileRequest {
  string worker_id = 1;
  string profile_id = 2;
}

message GrantProfileResponse {}

message RevokeProfileGrantRequest {
  string worker_id = 1;
  string profile_id = 2;
}

message RevokeProfileGrantResponse {}
