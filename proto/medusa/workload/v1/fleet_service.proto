syntax = "proto3";

package medusa.workload.v1;

option java_multiple_files = true;

option java_package = "software.medusa.workload.v1";

// The admin plane: managing workers, profiles, and (worker, profile) grants. Consumed by the
// console (SPA), behind the same auth as WorkloadService — not reachable with worker credentials.
service FleetService {
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);
  rpc ApproveWorker(ApproveWorkerRequest) returns (ApproveWorkerResponse);
  rpc RejectWorker(RejectWorkerRequest) returns (RejectWorkerResponse);
  rpc RevokeWorker(RevokeWorkerRequest) returns (RevokeWorkerResponse);
  // The operator pause/serve switch (M7-05): a paused node's workload-agent reconciles its
  // assignment set down to empty (stopping every agent-managed container) but keeps heartbeating
  // its AGENT-kind run, so it still shows present — just not serving. Idempotent either direction.
  rpc SetWorkerPaused(SetWorkerPausedRequest) returns (SetWorkerPausedResponse);
  // Marks/unmarks this worker as (one of) the shared fallback node(s) — see SetProfileFallbackEligible.
  rpc SetWorkerFallbackNode(SetWorkerFallbackNodeRequest) returns (SetWorkerFallbackNodeResponse);

  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  // Appends a revision; never mutates an existing one.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc ArchiveProfile(ArchiveProfileRequest) returns (ArchiveProfileResponse);
  // Fallback auto-placement (workload#122 part 2): while a profile is fallback-eligible, it is kept
  // auto-assigned to the shared fallback node (the oldest active worker with fallback_node = true)
  // whenever no dedicated assignment to a currently-active worker exists for it, and is migrated off
  // automatically the moment one appears. The auto-created assignment is otherwise an ordinary
  // Assignment, distinguishable only by its created_by ("system:fallback-placement").
  rpc SetProfileFallbackEligible(SetProfileFallbackEligibleRequest)
      returns (SetProfileFallbackEligibleResponse);
  rpc ListProfileRevisions(ListProfileRevisionsRequest) returns (ListProfileRevisionsResponse);
  // Dry-run mint against the latest revision's target service account; never returns a usable
  // token. CreateProfile/UpdateProfile run this implicitly against the revision they create.
  rpc VerifyProfile(VerifyProfileRequest) returns (VerifyProfileResponse);

  // Read-only preview: resolve a docker_image tag to a digest as a given target service account,
  // without creating anything. The console calls this so an admin sees the exact digest a tag
  // resolves to *before* pinning it, and so a missing artifactregistry.reader grant surfaces in the
  // form rather than as a flag on an already-created revision. The digest it returns is then passed
  // back as CreateProfile/UpdateProfile's expected_docker_image_digest (see there).
  rpc ResolveImage(ResolveImageRequest) returns (ResolveImageResponse);

  rpc GrantProfile(GrantProfileRequest) returns (GrantProfileResponse);
  rpc RevokeProfileGrant(RevokeProfileGrantRequest) returns (RevokeProfileGrantResponse);

  // Assignments: a first-class, admin-managed placement record — distinct from a grant. A grant is
  // authorization ("worker X may run profile Y"); an assignment is the placement decision itself
  // ("worker X is assigned profile Y"), independently listable, creatable, and deletable, with its
  // own id. Today creating an assignment does not also grant the profile (and vice versa) — the two
  // are deliberately separate primitives; a caller that wants both makes both calls.
  rpc ListAssignments(ListAssignmentsRequest) returns (ListAssignmentsResponse);
  rpc CreateAssignment(CreateAssignmentRequest) returns (CreateAssignmentResponse);
  rpc DeleteAssignment(DeleteAssignmentRequest) returns (DeleteAssignmentResponse);

  // Runs (M6-B1/B2): "who is running what". A run is created when a worker starts a `workload
  // run`/`exec`, heartbeats while alive, and ends with an exit code. Presence is derived from live
  // runs, never stored separately.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);

  // Enrollment tokens (M4 Path A): an admin mints a one-time `wle_` token and hands it to a
  // teammate, who exchanges it for a worker credential at registration. The plaintext is returned
  // by CreateEnrollmentToken exactly once and never again — only its hash is stored.
  rpc CreateEnrollmentToken(CreateEnrollmentTokenRequest) returns (CreateEnrollmentTokenResponse);
  rpc ListEnrollmentTokens(ListEnrollmentTokensRequest) returns (ListEnrollmentTokensResponse);
  rpc RevokeEnrollmentToken(RevokeEnrollmentTokenRequest) returns (RevokeEnrollmentTokenResponse);
}

enum WorkerStatus {
  WORKER_STATUS_UNSPECIFIED = 0;
  WORKER_STATUS_PENDING = 1;
  WORKER_STATUS_ACTIVE = 2;
  WORKER_STATUS_REJECTED = 3;
  WORKER_STATUS_REVOKED = 4;
}

// Whether the target SA's owning project has granted the broker impersonation rights, and (if
// the revision references any) whether that SA can read the referenced secrets.
enum VerificationStatus {
  VERIFICATION_STATUS_UNSPECIFIED = 0;
  VERIFICATION_STATUS_UNVERIFIED = 1;
  VERIFICATION_STATUS_VERIFIED = 2;
  VERIFICATION_STATUS_BINDING_MISSING = 3;
  VERIFICATION_STATUS_SECRET_INACCESSIBLE = 4;
}

// Outcome of resolving a revision's docker_image tag to an immutable digest at creation time
// (via an Artifact Registry manifest request impersonating the target SA).
enum ImageStatus {
  IMAGE_STATUS_UNSPECIFIED = 0;
  // The revision has no image (a pure exec/env profile).
  IMAGE_STATUS_NOT_APPLICABLE = 1;
  // A digest was pinned; the revision is image-claimable.
  IMAGE_STATUS_RESOLVED = 2;
  // Permanent denial (missing artifactregistry.reader binding, a typo, or a missing tag/repo).
  IMAGE_STATUS_UNRESOLVABLE = 3;
  // Transient failure; retried on the next create/update/verify.
  IMAGE_STATUS_UNDETERMINED = 4;
}

// A run's kind. AGENT (M7-05) is a long-lived agent-daemon presence session: no profile/revision,
// heartbeated for as long as workload-agent is up, ended when it shuts down cleanly.
enum RunKind {
  RUN_KIND_UNSPECIFIED = 0;
  RUN_KIND_RUN = 1;
  RUN_KIND_EXEC = 2;
  RUN_KIND_AGENT = 3;
}

// A run's lifecycle state. RUNNING/SUCCEEDED/FAILED are stored; LOST is derived at read time from a
// still-running run whose last heartbeat aged past the grace window (never persisted).
enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_RUNNING = 1;
  RUN_STATE_SUCCEEDED = 2;
  RUN_STATE_FAILED = 3;
  RUN_STATE_LOST = 4;
}

message Worker {
  string worker_id = 1;
  string name = 2;
  string hostname = 3;
  string os = 4;
  string cli_version = 5;
  WorkerStatus status = 6;
  // Field 7 was confirmation_code, dropped in M4-A5 with the retired v1 open-registration plane.
  reserved 7;
  reserved "confirmation_code";
  string created_at = 8;
  string approved_at = 9;
  string approved_by = 10;
  // Last time the worker made an authenticated call (token/claim, or a run heartbeat since M6-B1).
  // Empty until it first does so.
  string last_seen_at = 11;
  repeated string granted_profile_ids = 12;
  // Which registration plane the worker came through: "v1" (the retired open-registration plane) or
  // "v2" (enrollment-token exchange, now the only way to register). Shown in the console; retained
  // so pre-M4 workers keep an accurate provenance.
  string registered_via = 13;
  // The source IP the worker registered from — recorded for v2 (shown on a require_approval pending
  // row as a defense-in-depth signal); empty for v1.
  string source_ip = 14;
  // When the worker was revoked; empty unless status is REVOKED (M6-B2).
  string revoked_at = 15;
  // The operator pause/serve switch (M7-05). While true, this worker's workload-agent reconciles
  // its assignment set down to empty instead of the granted set — a drain, not a revoke: the
  // worker stays ACTIVE and keeps its grants, it just runs nothing until un-paused.
  bool paused = 16;
  // When paused was last set to true; empty unless paused.
  string paused_at = 17;
  // Marks this worker as (one of) the shared fallback node(s) for fallback-eligible profiles
  // (workload#122 part 2). See FallbackPlacementReconciler.
  bool fallback_node = 18;
}

// A run of a workload (M6-B1/B2). state may be LOST (a read-time derivation); everything else is as
// stored. worker_name is denormalized for display. profile_id/revision are empty/0 only for a
// future AGENT-kind run.
message Run {
  string run_id = 1;
  string worker_id = 2;
  string worker_name = 3;
  string profile_id = 4;
  int32 revision = 5;
  RunKind kind = 6;
  RunState state = 7;
  // The reported exit code; meaningful only when has_exit_code is true (proto3 can't tell 0 from
  // unset, and a run can end failed with no known code).
  int32 exit_code = 8;
  bool has_exit_code = 9;
  string started_at = 10;
  string last_heartbeat_at = 11;
  // Empty while the run is still going.
  string ended_at = 12;
  // The pinned image digest this run ran (display only); empty for exec/env runs.
  string image_digest = 13;
}

message ListRunsRequest {
  // Optional filters; empty string means "no filter on this dimension".
  string profile_id = 1;
  string worker_id = 2;
  // When true, only runs that haven't ended yet (effective state RUNNING or LOST).
  bool live_only = 3;
}

message ListRunsResponse {
  // Newest first.
  repeated Run runs = 1;
}

message ListWorkersRequest {}

message ListWorkersResponse {
  repeated Worker workers = 1;
}

message ApproveWorkerRequest {
  string worker_id = 1;
}

message ApproveWorkerResponse {
  Worker worker = 1;
}

message RejectWorkerRequest {
  string worker_id = 1;
}

message RejectWorkerResponse {
  Worker worker = 1;
}

message RevokeWorkerRequest {
  string worker_id = 1;
}

message RevokeWorkerResponse {
  Worker worker = 1;
}

message SetWorkerPausedRequest {
  string worker_id = 1;
  bool paused = 2;
}

message SetWorkerPausedResponse {
  Worker worker = 1;
}

message SetWorkerFallbackNodeRequest {
  string worker_id = 1;
  bool fallback_node = 2;
}

message SetWorkerFallbackNodeResponse {
  Worker worker = 1;
}

message Profile {
  string profile_id = 1;
  string display_name = 2;
  int32 latest_revision = 3;
  bool archived = 4;
  string created_at = 5;
  // Tags this profile for fallback auto-placement (workload#122 part 2). See
  // SetProfileFallbackEligible.
  bool fallback_eligible = 6;
}

message ProfileRevision {
  string profile_id = 1;
  int32 revision = 2;
  string target_service_account = 3;
  string created_at = 4;
  string created_by = 5;
  string note = 6;
  VerificationStatus verification_status = 7;
  // Plain, non-secret env vars: name -> value.
  map<string, string> env_vars = 8;
  // Secret-backed env vars: name -> Secret Manager resource name
  // (projects/.../secrets/.../versions/latest or a pinned version).
  map<string, string> secret_env_vars = 9;
  // Optional container image tag ref (e.g. LOCATION-docker.pkg.dev/PROJECT/REPO/IMAGE:TAG). Empty
  // for a pure exec/env profile.
  string docker_image = 10;
  // The digest docker_image resolved to at revision creation (sha256:...). Empty until/unless
  // resolution succeeds; a moved tag yields a different digest between revisions.
  string docker_image_digest = 11;
  // Resolution verdict for docker_image.
  ImageStatus image_status = 12;
  // Payload-declared stop timeout the supervisor passes as `D` when SIGTERM-draining a claim of
  // this revision (e.g. "6h" for the Flow worker) — how long the workload gets to finish an
  // in-flight session before the supervisor escalates to SIGKILL. Empty means the supervisor's own
  // default applies. A free-form duration string (e.g. "90m", "6h"); the CLI/console validate the
  // format, the backend stores it opaquely.
  string drain_deadline = 13;
}

message ListProfilesRequest {}

message ListProfilesResponse {
  repeated Profile profiles = 1;
}

message CreateProfileRequest {
  string profile_id = 1;
  string display_name = 2;
  string target_service_account = 3;
  string note = 4;
  map<string, string> env_vars = 5;
  map<string, string> secret_env_vars = 6;
  // Optional container image tag ref; the digest is resolved server-side.
  string docker_image = 7;
  // Optional compare-and-swap token: the digest a prior ResolveImage returned for this
  // docker_image. If set, the backend re-resolves the tag and rejects the create (FAILED_PRECONDITION)
  // when it no longer resolves to this digest — so the admin can only ever pin the exact digest they
  // previewed. Empty means "resolve fresh, no check" (e.g. non-console clients).
  string expected_docker_image_digest = 8;
  // See ProfileRevision.drain_deadline. Empty means "no change from the supervisor's default".
  string drain_deadline = 9;
}

message CreateProfileResponse {
  Profile profile = 1;
  ProfileRevision revision = 2;
}

message UpdateProfileRequest {
  string profile_id = 1;
  string target_service_account = 2;
  string note = 3;
  map<string, string> env_vars = 4;
  map<string, string> secret_env_vars = 5;
  // Optional container image tag ref; the digest is resolved server-side.
  string docker_image = 6;
  // Compare-and-swap token; see CreateProfileRequest.expected_docker_image_digest.
  string expected_docker_image_digest = 7;
  // See ProfileRevision.drain_deadline. Empty means "no change from the supervisor's default".
  string drain_deadline = 8;
}

message ResolveImageRequest {
  string target_service_account = 1;
  string docker_image = 2;
}

message ResolveImageResponse {
  // The digest the tag resolved to (sha256:...), or empty when it couldn't be resolved.
  string docker_image_digest = 1;
  ImageStatus image_status = 2;
  // Safe-to-show diagnostic when the status isn't RESOLVED (e.g. why it's unresolvable).
  string detail = 3;
}

message UpdateProfileResponse {
  Profile profile = 1;
  ProfileRevision revision = 2;
}

message ArchiveProfileRequest {
  string profile_id = 1;
}

message ArchiveProfileResponse {
  Profile profile = 1;
}

message SetProfileFallbackEligibleRequest {
  string profile_id = 1;
  bool fallback_eligible = 2;
}

message SetProfileFallbackEligibleResponse {
  Profile profile = 1;
}

message ListProfileRevisionsRequest {
  string profile_id = 1;
}

message ListProfileRevisionsResponse {
  repeated ProfileRevision revisions = 1;
}

message VerifyProfileRequest {
  string profile_id = 1;
}

message VerifyProfileResponse {
  ProfileRevision revision = 1;
}

// An outstanding enrollment token as shown in the console. Never carries the plaintext token or its
// hash — only the metadata needed to list, identify, and revoke it.
message EnrollmentToken {
  string enrollment_token_id = 1;
  string note = 2;
  string created_by = 3;
  string created_at = 4;
  string expires_at = 5;
  bool require_approval = 6;
}

message CreateEnrollmentTokenRequest {
  // Optional free-text label, e.g. "for Kuba's MBP".
  string note = 1;
  // Days until the token expires; the server applies a default (7) when unset or non-positive.
  int32 expires_in_days = 2;
  // When set, a worker registering with this token lands PENDING for admin approval instead of
  // going straight to ACTIVE.
  bool require_approval = 3;
}

message CreateEnrollmentTokenResponse {
  // The plaintext `wle_` token — shown once, never retrievable again.
  string token = 1;
  EnrollmentToken enrollment_token = 2;
}

message ListEnrollmentTokensRequest {}

message ListEnrollmentTokensResponse {
  // Outstanding tokens only (never redeemed, never revoked, not expired), newest first.
  repeated EnrollmentToken enrollment_tokens = 1;
}

message RevokeEnrollmentTokenRequest {
  string enrollment_token_id = 1;
}

message RevokeEnrollmentTokenResponse {}

message GrantProfileRequest {
  string worker_id = 1;
  string profile_id = 2;
}

message GrantProfileResponse {}

message RevokeProfileGrantRequest {
  string worker_id = 1;
  string profile_id = 2;
}

message RevokeProfileGrantResponse {}

// A first-class (worker, profile) placement record — see FleetService's doc comment on the
// Assignment RPCs for how this differs from a Grant.
message Assignment {
  string assignment_id = 1;
  string worker_id = 2;
  string profile_id = 3;
  string created_at = 4;
  string created_by = 5;
}

message ListAssignmentsRequest {
  // Optional filters; empty string means "no filter on this dimension".
  string worker_id = 1;
  string profile_id = 2;
}

message ListAssignmentsResponse {
  repeated Assignment assignments = 1;
}

message CreateAssignmentRequest {
  string worker_id = 1;
  string profile_id = 2;
}

message CreateAssignmentResponse {
  Assignment assignment = 1;
}

message DeleteAssignmentRequest {
  string assignment_id = 1;
}

message DeleteAssignmentResponse {}
