[versions]
armeria = "1.38.0"
detekt = "1.23.8"
flyway = "11.13.0"
google-cloud-libraries-bom = "26.83.0"
grpc = "1.80.0"
grpc-kotlin = "1.5.0"
hikari = "7.0.2"
jib = "3.5.3"
kotlin = "2.3.20"
kotlin-coroutines = "1.10.2"
kotlinx-serialization = "1.9.0"
ktfmt = "0.26.0"
logback = "1.5.32"
nimbus-jose-jwt = "10.9"
postgresql = "42.7.8"
protobuf = "4.34.1"
protobuf-plugin = "0.10.0"
shadow = "9.4.2"
slf4j = "2.0.17"
sqldelight = "2.3.2"
versionCatalogUpdate = "1.1.0"

[libraries]
armeria = { module = "com.linecorp.armeria:armeria" }
armeria-bom = { module = "com.linecorp.armeria:armeria-bom", version.ref = "armeria" }
armeria-grpc = { module = "com.linecorp.armeria:armeria-grpc", version.ref = "armeria" }
armeria-grpc-kotlin = { module = "com.linecorp.armeria:armeria-grpc-kotlin", version.ref = "armeria" }
armeria-kotlin = { module = "com.linecorp.armeria:armeria-kotlin", version.ref = "armeria" }
clikt = "com.github.ajalt.clikt:clikt-jvm:5.1.0"
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
google-auth-oauth2-http = { module = "com.google.auth:google-auth-library-oauth2-http" }
google-cloud-iamcredentials = { module = "com.google.cloud:google-cloud-iamcredentials" }
google-cloud-libraries-bom = { module = "com.google.cloud:libraries-bom", version.ref = "google-cloud-libraries-bom" }
google-cloud-secretmanager = { module = "com.google.cloud:google-cloud-secretmanager" }
google-cloud-storage = { module = "com.google.cloud:google-cloud-storage" }
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpc-kotlin" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
kotlinx-coroutines-reactive = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactive", version.ref = "kotlin-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
# Netty native UDS transport. epoll is the Ubuntu-first primary (linux). Version is managed by the
# Armeria BOM (no explicit version here); the arch classifier is applied per-artifact in
# libraries/docker-connector/build.gradle.kts. kqueue (macOS) lands in story 08.
netty-transport-native-epoll = { module = "io.netty:netty-transport-native-epoll" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
protobuf-kotlin = { module = "com.google.protobuf:protobuf-kotlin", version.ref = "protobuf" }
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
protobuf-protocGen-grpc-java = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpc" }
protobuf-protocGen-grpc-kotlin = "io.grpc:protoc-gen-grpc-kotlin:1.5.0"
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
sqldelight-jdbc-driver = { module = "app.cash.sqldelight:jdbc-driver", version.ref = "sqldelight" }
sqldelight-postgresql-dialect = { module = "app.cash.sqldelight:postgresql-dialect", version.ref = "sqldelight" }

[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
versionCatalogUpdate = { id = "nl.littlerobots.version-catalog-update", version.ref = "versionCatalogUpdate" }
