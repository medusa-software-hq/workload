[versions]
armeria = "1.38.0"
detekt = "1.23.8"
kotlin = "2.3.20"
kotlin-coroutines = "1.10.2"
kotlinx-serialization = "1.9.0"
ktfmt = "0.26.0"
slf4j = "2.0.17"
versionCatalogUpdate = "1.1.0"

[libraries]
armeria-bom = { module = "com.linecorp.armeria:armeria-bom", version.ref = "armeria" }
armeria = { module = "com.linecorp.armeria:armeria" }
armeria-kotlin = { module = "com.linecorp.armeria:armeria-kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
kotlinx-coroutines-reactive = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactive", version.ref = "kotlin-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
# Netty native UDS transport. epoll is the Ubuntu-first primary (linux). Version is managed by the
# Armeria BOM (no explicit version here); the arch classifier is applied per-artifact in
# build.gradle.kts. kqueue (macOS) lands in story 08.
netty-transport-native-epoll = { module = "io.netty:netty-transport-native-epoll" }

[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
versionCatalogUpdate = { id = "nl.littlerobots.version-catalog-update", version.ref = "versionCatalogUpdate" }
