name: Set up Caddy
description: Install the Caddy web server CLI

inputs:
  caddy-version:
    description: Caddy version to install (without leading 'v')
    required: true

runs:
  using: composite
  steps:
    - name: Install Caddy
      shell: bash
      env:
        CADDY_VERSION: ${{ inputs.caddy-version }}
      run: |
        curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz" \
          | tar -xz -C /usr/local/bin caddy
        caddy version
