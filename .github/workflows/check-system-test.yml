name: Check system-test

# The hermetic leg (issue: "system-test harness"): drives the real CLI binary through full
# register -> exec flows against the in-process local backend (LocalStack.kt) — no GCP, no Docker,
# no network beyond loopback. The staging leg runs on its own nightly schedule (see
# system-test-nightly.yml), not here.
on:
  workflow_call:

permissions:
  contents: read

env:
  NO_COLOR: 1

jobs:
  test:
    name: Test (local)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the CLI binary the suite drives
        run: ./gradlew :cli:installDist

      - name: Run the system-test suite against the hermetic local stack
        env:
          SYSTEM_TEST_TARGET: local
        run: ./gradlew :system-test:test
