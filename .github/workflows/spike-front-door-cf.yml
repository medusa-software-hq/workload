name: Spike - front door (Cloudflare)

# Manual only, throwaway. Phase 2 of the M4-A6 front-door verification (see
# plan/m4/findings/front-door.md). Phase 1 proved, GCP-side, that Cloud Run honours
# X-Serverless-Authorization for IAM while forwarding the app's Authorization header, and that a
# direct un-authenticated hit is rejected at the edge. This one closes the loop: it proves a real
# Cloudflare Worker can front an IAM-locked run.app service — attaching X-Serverless-Authorization
# and forwarding the client's Authorization — so the whole client -> Worker -> GFE -> app path works.
#
# It deploys a throwaway IAM-locked echo service (as in phase 1), uploads a throwaway Cloudflare
# Worker that proxies to it, curls the Worker end to end, and deletes both in a final always() step.
# Neither the production api service/DNS nor any real Worker is touched. Needs CLOUDFLARE_API_TOKEN
# with Workers Scripts: Edit (the account ID is discovered via the API).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  NO_COLOR: 1
  SERVICE_NAME: spike-front-door-echo
  WORKER_NAME: spike-front-door-worker
  CF_API: https://api.cloudflare.com/client/v4

jobs:
  spike:
    name: Front-door Cloudflare spike
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_CICD_WI_PROVIDER_NAME }}
          service_account: ${{ vars.GCP_CICD_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify Docker daemon is available
        run: docker version

      - name: Stage the echo image in Artifact Registry
        run: |
          set -euo pipefail
          IMAGE="${{ vars.GCP_AR_REPO_ENDPOINT }}/spike-echo:${{ github.run_id }}"
          gcloud auth configure-docker "${{ vars.GCP_AR_REPO_HOSTNAME }}" --quiet
          docker pull ealen/echo-server:latest
          docker tag ealen/echo-server:latest "$IMAGE"
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy a throwaway IAM-locked echo service
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE_NAME" \
            --image="$IMAGE" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_PRIMARY_LOCATION }}" \
            --platform=managed \
            --no-allow-unauthenticated \
            --max-instances=1 \
            --quiet
          URL=$(gcloud run services describe "$SERVICE_NAME" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_PRIMARY_LOCATION }}" \
            --format='value(status.url)')
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo "Echo service URL: $URL"

      - name: Grant the CI SA run.invoker on the echo service
        run: |
          set -euo pipefail
          gcloud run services add-iam-policy-binding "$SERVICE_NAME" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_PRIMARY_LOCATION }}" \
            --member="serviceAccount:${{ vars.GCP_CICD_SA_EMAIL }}" \
            --role="roles/run.invoker" \
            --quiet

      - name: Mint an ID token for the echo service audience
        id: idtoken
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_CICD_WI_PROVIDER_NAME }}
          service_account: ${{ vars.GCP_CICD_SA_EMAIL }}
          token_format: id_token
          id_token_audience: ${{ env.URL }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Discover the Cloudflare account + subdomain
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CF_TOKEN")
          accounts=$(curl -sS "${auth[@]}" "$CF_API/accounts")
          echo "$accounts" | jq -e '.success' >/dev/null || { echo "Failed to list accounts: $accounts"; exit 1; }
          CF_ACCOUNT=$(echo "$accounts" | jq -r '.result[0].id')
          CF_ACCOUNT_NAME=$(echo "$accounts" | jq -r '.result[0].name')
          test -n "$CF_ACCOUNT" -a "$CF_ACCOUNT" != "null" || { echo "No accessible Cloudflare account"; exit 1; }
          echo "Account: $CF_ACCOUNT_NAME ($CF_ACCOUNT)"
          sub=$(curl -sS "${auth[@]}" "$CF_API/accounts/$CF_ACCOUNT/workers/subdomain")
          CF_SUBDOMAIN=$(echo "$sub" | jq -r '.result.subdomain // empty')
          test -n "$CF_SUBDOMAIN" || {
            echo "This account has no workers.dev subdomain enabled; enable it once in the Cloudflare"
            echo "dashboard (Workers & Pages) and re-run. Raw: $sub"; exit 1; }
          echo "workers.dev subdomain: $CF_SUBDOMAIN"
          echo "CF_ACCOUNT=$CF_ACCOUNT" >> "$GITHUB_ENV"
          echo "WORKER_URL=https://$WORKER_NAME.$CF_SUBDOMAIN.workers.dev" >> "$GITHUB_ENV"

      - name: Upload the throwaway proxy Worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
        run: |
          set -euo pipefail
          # Service-worker syntax; the short-lived ID token + target are baked in (throwaway, deleted
          # below). Forwards the client's Authorization untouched and adds the platform header.
          cat > worker.js <<EOF
          const TARGET_URL = "$URL";
          const ID_TOKEN = "$ID_TOKEN";
          addEventListener('fetch', function (event) { event.respondWith(handle(event.request)); });
          async function handle(request) {
            const inUrl = new URL(request.url);
            const out = TARGET_URL.replace(/\/+\$/, '') + inUrl.pathname + inUrl.search;
            const headers = new Headers(request.headers);
            headers.delete('Host');
            headers.set('X-Serverless-Authorization', 'Bearer ' + ID_TOKEN);
            return fetch(out, { method: request.method, headers: headers, body: request.body, redirect: 'manual' });
          }
          EOF
          upload=$(curl -sS -X PUT "$CF_API/accounts/$CF_ACCOUNT/workers/scripts/$WORKER_NAME" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/javascript" \
            --data-binary @worker.js)
          echo "$upload" | jq -e '.success' >/dev/null || { echo "Worker upload failed: $upload"; exit 1; }
          enable=$(curl -sS -X POST "$CF_API/accounts/$CF_ACCOUNT/workers/scripts/$WORKER_NAME/subdomain" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"enabled":true}')
          echo "Enable workers.dev: $(echo "$enable" | jq -c '.success // .errors')"
          echo "Worker URL: $WORKER_URL"

      - name: 'Claim - full client to Worker to GFE to app path'
        run: |
          set -euo pipefail
          APP_MARKER="app-authz-${{ github.run_id }}-$RANDOM"
          echo "Waiting for the Worker route to propagate..."
          code=""
          for i in $(seq 1 10); do
            code=$(curl -sS -o /tmp/cf.json -w '%{http_code}' \
              -H "Authorization: Bearer $APP_MARKER" "$WORKER_URL/?probe=cf-${{ github.run_id }}" || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          echo "Status through the Worker: $code (expect 200)"
          echo "--- echo body ---"; cat /tmp/cf.json; echo
          test "$code" = "200" || { echo "FAIL: expected 200 through the Worker"; exit 1; }
          if grep -q "$APP_MARKER" /tmp/cf.json; then
            echo "PASS: client Authorization survived the Worker + GFE and reached the app"
          else
            echo "FAIL: the client's Authorization header did not reach the app"; exit 1
          fi

      - name: Cleanup (always)
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Deleting throwaway resources..."
          if [ -n "${CF_ACCOUNT:-}" ]; then
            curl -sS -X DELETE "$CF_API/accounts/$CF_ACCOUNT/workers/scripts/$WORKER_NAME" \
              -H "Authorization: Bearer $CF_TOKEN" | jq -c '.success // .errors' || true
          fi
          gcloud run services delete "$SERVICE_NAME" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_PRIMARY_LOCATION }}" --quiet || true
          if [ -n "${IMAGE:-}" ]; then
            gcloud artifacts docker images delete "$IMAGE" --delete-tags --quiet || true
          fi
          echo "Cleanup done."
