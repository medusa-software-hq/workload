name: Refresh front-door token

# Keeps the front door's credential alive, keylessly. The org disables service-account keys
# (constraints/iam.disableServiceAccountKeyCreation), so instead of a key the Worker holds a
# short-lived (~1 h) Google ID token for the front-door-invoker SA. This workflow mints one via
# impersonation (WIF -> CI SA -> generateIdToken on front-door-invoker, audience = the broker's
# run.app URL) and pushes it into the Worker's INVOKER_ID_TOKEN secret. It runs on a cron with
# generous overlap so a delayed run never lets the token expire; workflow_dispatch mints one now.
#
# The CI identity may mint ID tokens for *only* this SA (resource-level
# roles/iam.serviceAccountOpenIdTokenCreator, backend/infra/gcp-front-door-invoker.tf). The token is
# never printed and lives only in the Worker secret.
on:
  workflow_dispatch:
  schedule:
    # Every 20 min; the token is valid 60 min, so ~3x overlap tolerates delayed/missed scheduled runs.
    - cron: "*/20 * * * *"

permissions:
  contents: read
  id-token: write

env:
  NO_COLOR: 1
  WORKER_NAME: workload-front-door
  CF_ACCOUNT: b703ded0019355a0913800063af2a5f5
  CF_API: https://api.cloudflare.com/client/v4
  # Must match the Worker's TARGET_AUDIENCE / ORIGIN_URL (the broker's Cloud Run service URL).
  AUDIENCE: https://api-s5hue5meiq-ew.a.run.app

jobs:
  refresh:
    name: Mint + push the invoker ID token
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_CICD_WI_PROVIDER_NAME }}
          service_account: ${{ vars.GCP_CICD_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Mint + push the invoker ID token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SA: front-door-invoker@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
        run: |
          set -euo pipefail
          umask 077
          # Impersonate front-door-invoker to mint an ID token for the broker's audience. The org
          # blocks keys, not token minting, so this path is allowed.
          access=$(gcloud auth print-access-token)
          id_token=$(curl -sS -X POST \
            "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/$SA:generateIdToken" \
            -H "Authorization: Bearer $access" -H "Content-Type: application/json" \
            -d "$(jq -n --arg aud "$AUDIENCE" '{audience:$aud, includeEmail:true}')" \
            | jq -r '.token // empty')
          test -n "$id_token" || { echo "Failed to mint the ID token"; exit 1; }

          # Push it into the Worker secret (jq escapes it; never echoed).
          jq -n --arg text "$id_token" '{name:"INVOKER_ID_TOKEN", text:$text, type:"secret_text"}' > /tmp/payload.json
          result=$(curl -sS -X PUT \
            "$CF_API/accounts/$CF_ACCOUNT/workers/scripts/$WORKER_NAME/secrets" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/payload.json | jq -r '.success')
          rm -f /tmp/payload.json
          test "$result" = "true" || { echo "Pushing the Worker secret failed"; exit 1; }
          echo "Refreshed the front-door INVOKER_ID_TOKEN secret."
