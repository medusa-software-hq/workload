name: System test (nightly, staging)

# The staging leg of the system-test harness (see system-test/README.md): the same suite
# check-system-test.yml runs hermetically in PR CI, run for real against staging — a real worker,
# real brokered tokens, and (via infra/system-test's Terraform fixtures) a real private-registry
# image pull. Nightly rather than per-PR: it mutates real fleet state and the long-run-refresh leg
# genuinely runs ~15+ minutes against staging's real token lifetime.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  NO_COLOR: 1

jobs:
  test:
    name: Test (staging)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Mints an ID token for the s2s admin principal (audience = the staging API URL) — the same
      # shape smoke/smoke.sh and integration-test-registry-auth.yml use.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_CICD_WI_PROVIDER_NAME }}
          service_account: ${{ vars.GCP_CI_ADMIN_SA_EMAIL }}
          token_format: id_token
          id_token_audience: ${{ vars.API_URL }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Build the CLI binary the suite drives
        run: ./gradlew :cli:installDist

      - name: Run the system-test suite against staging
        env:
          SYSTEM_TEST_TARGET: staging
          STAGING_ADMIN_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          # Set once infra/system-test has been applied by hand (see its README) and its outputs
          # (image_repository / hand_test_profile_inputs-style target SA) are recorded here as repo
          # variables; the container-pull leg self-skips until then.
          STAGING_TEST_IMAGE_REF: ${{ vars.SYSTEM_TEST_IMAGE_REF }}
          STAGING_TEST_TARGET_SA: ${{ vars.SYSTEM_TEST_TARGET_SA }}
        run: ./gradlew :system-test:test
