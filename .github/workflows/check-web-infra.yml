name: Check web infra

on:
  workflow_call:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.14

  TF_INPUT: false
  TF_CLI_ARGS: -no-color
  NO_COLOR: 1

jobs:
  check-config:
    name: Check Terraform configuration
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_CICD_WI_PROVIDER_NAME }}
          service_account: ${{ vars.GCP_CICD_SA_EMAIL }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~> ${{ env.TERRAFORM_VERSION }}

      - uses: terraform-linters/setup-tflint@v6.2.2

      - name: Check formatting
        working-directory: apps/web/infra/foundation
        run: terraform fmt -check -recursive

      - name: Lint Terraform configuration
        working-directory: apps/web/infra/foundation
        run: tflint --recursive

      - name: Plan Terraform application
        working-directory: apps/web/infra/foundation
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        run: |
          terraform init
          terraform plan | tee terraform-plan.txt
          {
            echo '## Terraform plan (Foundation)'
            echo ''
            echo '```'
            cat terraform-plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
