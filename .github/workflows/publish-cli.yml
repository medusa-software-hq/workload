name: Publish CLI

on:
  push:
    branches: ["trunk/*"]
    paths:
      - "cli/**"
      # workload-agent ships in this same release (see the "Build workload-agent fat jar" step
      # below) — node.yaml.tmpl downloads both jars from one release tag, so a change to the
      # daemon or the runtime library it (and the CLI) shares needs to cut a release too.
      - "workload-agent/**"
      - "libraries/workload-runtime/**"
      - "libraries/docker-connector/**"

  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: 21

jobs:
  publish-cli:
    name: Publish CLI fat jar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build fat jar
        working-directory: cli
        # Bake publish-time values into the jar (see BuildConfig): the per-environment admin OAuth
        # client secrets (non-confidential for a Desktop OAuth client, but kept out of source so
        # GitHub's push protection doesn't fight us) and the metadata-sidecar image ref `workload
        # run` pulls. Backend URLs + client ids are not baked — they're deterministic public source
        # constants on `Environment` — but the sidecar image ref can't be, since the Artifact
        # Registry project id carries a build-time-random suffix; GCP_AR_REPO_ENDPOINT is this repo's
        # existing plain (non-secret) variable for it. The staging OAuth secret is optional: if unset
        # it bakes empty, and staging `admin login` reports that cleanly.
        env:
          ADMIN_OAUTH_CLIENT_SECRET: ${{ secrets.WORKLOAD_ADMIN_OAUTH_CLIENT_SECRET }}
          STAGING_ADMIN_OAUTH_CLIENT_SECRET: ${{ secrets.WORKLOAD_ADMIN_OAUTH_CLIENT_SECRET_STAGING }}
          METADATA_SIDECAR_IMAGE: ${{ vars.GCP_AR_REPO_ENDPOINT }}/workload/metadata-emulator
          CLOUDFLARED_ACCESS_SIDECAR_IMAGE: ${{ vars.GCP_AR_REPO_ENDPOINT }}/workload/cloudflared-access
        run: |
          ../gradlew shadowJar \
            -PadminOauthClientSecret="$ADMIN_OAUTH_CLIENT_SECRET" \
            -PstagingAdminOauthClientSecret="$STAGING_ADMIN_OAUTH_CLIENT_SECRET" \
            -PmetadataSidecarImage="$METADATA_SIDECAR_IMAGE" \
            -PcloudflaredAccessSidecarImage="$CLOUDFLARED_ACCESS_SIDECAR_IMAGE"
          echo "JAR=$GITHUB_WORKSPACE/cli/build/libs/workload-cli.jar" >> $GITHUB_ENV
          echo "VERSION=0.0.${{ github.run_number }}" >> $GITHUB_ENV

      # workload-agent is the node daemon node.yaml.tmpl's workload-agent.service unit runs. It
      # ships under the same $VERSION tag as the CLI so the node template's single cli_version
      # placeholder resolves both downloads off one release (see node/cloud-init/node.yaml.tmpl).
      # Renamed from the shadowJar's default "-all" classifier output to the plain
      # "workload-agent.jar" the node template downloads — see workload-agent/build.gradle.kts for
      # why the classifier itself can't be blanked the way cli's is.
      - name: Build workload-agent fat jar
        run: |
          ./gradlew :workload-agent:shadowJar
          cp workload-agent/build/libs/workload-agent-all.jar workload-agent/build/libs/workload-agent.jar
          echo "AGENT_JAR=$GITHUB_WORKSPACE/workload-agent/build/libs/workload-agent.jar" >> $GITHUB_ENV

      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GH_RELEASES_CLIENT_ID }}
          private-key: ${{ secrets.GH_RELEASES_APP_PEM_CONTENT }}
          owner: medusa-software-hq
          repositories: workload-releases,homebrew-tap

      - name: Create a release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "${VERSION}" \
            --repo medusa-software-hq/workload-releases \
            --title "Workload CLI ${VERSION}" \
            --notes "Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
            "${JAR}" "${AGENT_JAR}"

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Update Homebrew formula
        working-directory: cli/tools/update-formula
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: uv run update_formula.py --version "${VERSION}" --jar "${JAR}"
