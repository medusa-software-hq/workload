name: Apply web domain mapping

on:
  push:
    branches: ["trunk/*"]
    paths:
      - "apps/web/infra/domain-mapping/**"

  workflow_dispatch:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.14

  TF_INPUT: false
  TF_CLI_ARGS: -no-color
  NO_COLOR: 1

jobs:
  apply-config:
    name: Apply (${{ matrix.environment }})
    runs-on: ubuntu-latest

    # One job per environment; staging first, serialized, fail-fast (see apply-backend-infra.yml for
    # the rationale). `environment:` resolves the per-env project (GCP_PROJECT_ID) while the shared
    # domain-mapper SA and Cloudflare zone fall back to the repo-level vars.
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - environment: staging
            workspace: staging
          - environment: production
            workspace: default

    environment: ${{ matrix.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Authenticate as the shared domain-mapper SA (a verified domain owner),
      # not this project's CI/CD SA. Trunk-only trigger keeps it off PRs.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_CICD_WI_PROVIDER_NAME }}
          service_account: ${{ vars.GCP_DOMAIN_MAPPER_SA_EMAIL }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~> ${{ env.TERRAFORM_VERSION }}

      - name: Apply Terraform configuration
        working-directory: apps/web/infra/domain-mapping
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          terraform init
          terraform workspace select -or-create=true ${{ matrix.workspace }}
          terraform apply -auto-approve
